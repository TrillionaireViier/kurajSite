<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - KURAJ FASHION</title>
<link rel="stylesheet" href="/header-styles.css?v=1783850048">
<link rel="stylesheet" href="/styles.css?v=1783850048">
<link rel="stylesheet" href="/cart-styles.css?v=1783850048">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --primary-color:#fff; --bg-dark:#0a0a0a; --text-light:#ccc; }
  body { background:var(--bg-dark); color:var(--primary-color); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  .auth-wrapper { flex:1; display:flex; align-items:center; justify-content:center; padding:120px 20px 60px; }
  .auth-box { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:50px 40px; max-width:460px; width:100%; backdrop-filter:blur(20px); }
  .auth-box h1 { font-family:'Playfair Display',serif; font-size:2.2rem; margin-bottom:8px; }
  .auth-box p { color:var(--text-light); margin-bottom:36px; font-size:0.95rem; }
  .tab-row { display:flex; gap:0; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .tab { flex:1; padding:12px; background:transparent; border:none; color:var(--text-light); font-size:1rem; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
  .tab.active { color:#fff; border-bottom-color:#fff; }
  .form-group { margin-bottom:20px; }
  .form-group label { display:block; font-size:0.85rem; color:var(--text-light); margin-bottom:8px; letter-spacing:.5px; text-transform:uppercase; }
  .form-group input { width:100%; padding:14px 16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:8px; color:#fff; font-size:1rem; outline:none; transition:border-color 0.2s; box-sizing:border-box; }
  .form-group input:focus { border-color:rgba(255,255,255,0.4); }
  .auth-btn { width:100%; padding:15px; background:#fff; color:#000; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:10px; transition:opacity 0.2s; letter-spacing:.5px; }
  .auth-btn:hover { opacity:0.88; }
  .divider { text-align:center; color:var(--text-light); font-size:0.85rem; margin:20px 0; position:relative; }
  .divider::before, .divider::after { content:''; position:absolute; top:50%; width:40%; height:1px; background:rgba(255,255,255,0.1); }
  .divider::before { left:0; } .divider::after { right:0; }
  .vip-note { text-align:center; margin-top:24px; font-size:0.85rem; color:var(--text-light); }
  .vip-note a { color:#fff; text-decoration:underline; }
  #signUpForm { display:none; }
  .notice { background:rgba(255,255,255,0.08); border-radius:8px; padding:14px 16px; font-size:0.88rem; color:var(--text-light); margin-bottom:24px; border-left:3px solid rgba(255,255,255,0.3); }
</style>
</head>
<body>
<header class="header" id="mainHeader"></header>

<div class="auth-wrapper">
  <div class="auth-box">
    <h1>Member Access</h1>
    <p>KURAJ FASHION Exclusive Club</p>

    <div class="tab-row">
      <button class="tab active" onclick="showTab('signIn')">Sign In</button>
      <button class="tab" onclick="showTab('signUp')">Join the Club</button>
    </div>

    <div class="notice">🔒 Member portal coming soon. Join our waitlist below to be first in line.</div>

    <form id="signInForm" onsubmit="handleSignIn(event)">
      <div class="form-group"><label>Email</label><input type="email" placeholder="your@email.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" placeholder="••••••••" required></div>
      <button type="submit" class="auth-btn">Sign In</button>
      <p class="vip-note" style="margin-top:14px;"><a href="#" onclick="showTab('signUp');return false;">Not a member? Join the Club →</a></p>
    </form>

    <form id="signUpForm" onsubmit="handleSignUp(event)">
      <div class="form-group"><label>Full Name</label><input type="text" placeholder="Your Name" required></div>
      <div class="form-group"><label>Email</label><input type="email" placeholder="your@email.com" required></div>
      <div class="form-group"><label>Phone (optional)</label><input type="tel" placeholder="+1 555 000 0000"></div>
      <div class="form-group"><label>Password</label><input type="password" placeholder="Create a password" required></div>
      <button type="submit" class="auth-btn">Request Membership</button>
      <p class="vip-note">By joining you agree to our <a href="/legal/terms-conditions">Terms</a> &amp; <a href="/legal/privacy-policy">Privacy Policy</a></p>
    </form>
  </div>
</div>

<script src="/header-injector.js?v=1783866858"></script>
<script src="/cart.js?v=1783850048"></script>
<script src="/cart-sync.js?v=1783866855"></script>
<script src="/script.js"></script>
<script>
function showTab(tab) {
  document.getElementById('signInForm').style.display = tab === 'signIn' ? 'block' : 'none';
  document.getElementById('signUpForm').style.display = tab === 'signUp' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='signIn'&&i===0)||(tab==='signUp'&&i===1)));
}
function handleSignIn(e) {
  e.preventDefault();
  if (window.showNotification) showNotification('Member portal coming soon! We'll notify you when it launches.', 'info');
  else alert('Member portal coming soon! We'll notify you when it launches.');
}
function handleSignUp(e) {
  e.preventDefault();
  if (window.showNotification) showNotification('Thank you for your interest! We'll be in touch shortly.', 'success');
  else alert('Thank you! We'll be in touch shortly.');
  e.target.reset();
}
</script>
</body>
</html>
